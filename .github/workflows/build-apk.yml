name: Build Surveillance APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout openclaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          path: openclaw

      - name: Checkout surveillance patches
        uses: actions/checkout@v4
        with:
          path: patches

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply surveillance patches
        run: |
          set -e
          TARGET="openclaw/apps/android/app/src/main/java/com/openclaw/surveillance"
          mkdir -p "$TARGET"
          cp -r patches/app/src/main/java/com/openclaw/surveillance/* "$TARGET/"
          
          # Add CameraX, ML Kit, MediaRecorder deps to build.gradle.kts
          BUILD_FILE="openclaw/apps/android/app/build.gradle.kts"
          if ! grep -q "camerax" "$BUILD_FILE"; then
            cat >> "$BUILD_FILE" << 'DEPS'

          // === Surveillance Module Dependencies ===
          val cameraxVersion = "1.3.4"
          implementation("androidx.camera:camera-core:$cameraxVersion")
          implementation("androidx.camera:camera-camera2:$cameraxVersion")
          implementation("androidx.camera:camera-lifecycle:$cameraxVersion")
          implementation("androidx.camera:camera-video:$cameraxVersion")
          implementation("com.google.mlkit:face-detection:16.1.7")
          DEPS
          fi
          
          echo "Surveillance patches applied successfully"
          echo "Source files:"
          find "$TARGET" -name "*.kt" -type f | sort

      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore openclaw/apps/android/debug.keystore \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=OpenClaw, OU=Surveillance, O=OpenClaw, L=Unknown, ST=Unknown, C=US"

      - name: Build debug APK
        run: |
          cd openclaw/apps/android
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-surveillance-debug
          path: openclaw/apps/android/app/build/outputs/apk/debug/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: openclaw/apps/android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
