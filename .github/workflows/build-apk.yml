name: Build Surveillance APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Install required SDK components
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Download Gradle wrapper JAR
        run: |
          echo "Checking built-in wrapper..."
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ $(stat -c%s gradle/wrapper/gradle-wrapper.jar 2>/dev/null || echo 0) -lt 1000 ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sL --retry 5 --retry-delay 10 \
              "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -o /tmp/gradle-bin.zip
            unzip -q -j /tmp/gradle-bin.zip "*/lib/gradle-wrapper-*.jar" -d gradle/wrapper/
            mv gradle/wrapper/gradle-wrapper-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
            # Fallback: download direct from raw.githubusercontent
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              curl -sL --retry 10 --retry-delay 30 \
                "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
                -o gradle/wrapper/gradle-wrapper.jar
            fi
          fi
          ls -la gradle/wrapper/gradle-wrapper.jar
          echo "JAR size: $(stat -c%s gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Create app project
        run: |
          mkdir -p app/src/main/java app/src/main/res/values

          cat > app/build.gradle.kts << 'BEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.openclaw.surveillance"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.openclaw.surveillance"
                  minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              val cv = "1.3.4"
              implementation("androidx.camera:camera-core:$cv")
              implementation("androidx.camera:camera-camera2:$cv")
              implementation("androidx.camera:camera-lifecycle:$cv")
              implementation("androidx.camera:camera-video:$cv")
              implementation("com.google.mlkit:face-detection:16.1.7")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-service:2.8.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          BEOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <application android:allowBackup="true" android:supportsRtl="true">
                  <service android:name=".service.SurveillanceService"
                      android:exported="false"
                      android:foregroundServiceType="camera" />
              </application>
          </manifest>
          EOF

      - name: Verify source files
        run: |
          echo "=== Source files ==="
          find app/src/main/java -name "*.kt" -type f | sort
          echo "=== Project root ==="
          ls -la

      - name: Generate gradlew
        run: |
          cat > gradlew << 'GSEOF'
          #!/bin/sh
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          APP_HOME="$(dirname "$SCRIPT_DIR")"
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          exec java -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GSEOF
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-surveillance
          path: app/build/outputs/apk/debug/*.apk
