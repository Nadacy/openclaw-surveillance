name: Build Surveillance APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          generate-job-summary: false

      - name: Install Gradle & Create project
        run: |
          # Install Gradle
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH="/tmp/gradle-8.7/bin:$PATH"
          
          mkdir -p app/src/main/res/values

          # Generate Gradle wrapper
          gradle wrapper --gradle-version 8.7

          mkdir -p app/src/main/res/values

          # settings.gradle.kts
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OpenClawSurveillance"
          include(":app")
          EOF

          # root build.gradle.kts
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # app/build.gradle.kts
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.openclaw.surveillance"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.openclaw.surveillance"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              // CameraX
              val cameraxVersion = "1.3.4"
              implementation("androidx.camera:camera-core:${cameraxVersion}")
              implementation("androidx.camera:camera-camera2:${cameraxVersion}")
              implementation("androidx.camera:camera-lifecycle:${cameraxVersion}")
              implementation("androidx.camera:camera-video:${cameraxVersion}")

              // ML Kit Face Detection
              implementation("com.google.mlkit:face-detection:16.1.7")

              // AndroidX
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-service:2.8.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.2")

              // Coroutines
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.camera" android:required="true" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:supportsRtl="true">

                  <service
                      android:name=".service.SurveillanceService"
                      android:exported="false"
                      android:foregroundServiceType="camera" />

              </application>
          </manifest>
          EOF

          # strings.xml
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">OpenClaw Surveillance</string>
          </resources>
          EOF

      - name: Copy source files
        run: |
          mkdir -p app/src/main/java
          cp -r app/src/main/java/com app/src/main/java/com 2>/dev/null || true
          find app/src/main/java -name "*.kt" | sort

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-surveillance
          path: app/build/outputs/apk/debug/*.apk
